r"><div><span class="eyebrow">AUTHORISATION CHECKPOINT</span><h2>Surface the next decision, not more noise.</h2><p>Every workflow remains local, mock-data based, and intended for documented exercises and control reviews.</p></div><button class="btn primary" onclick="navigate('Operations')">Open operation register</button></div>`,
      'Operations':()=>title('01','Operation register','Engagements, rules of engagement, and task-state tracking — stored only in this browser.',`<button class="btn primary" onclick="addOperation()">+ Add operation</button>`)+panel(['ENGAGEMENTS','Approved planning register',''],`<div class="tablewrap"><table><thead><tr><th>Operation</th><th>Sector</th><th>Phase</th><th>Status</th><th>Start</th><th>Lead</th><th>Risk</th><th></th></tr></thead><tbody>${operations.map((o,i)=>`<tr><td><b>${esc(o.name)}</b><code>${o.id}</code></td><td>${esc(o.sector)}</td><td>${esc(o.phase)}</td><td>${pill(o.status)}</td><td><code>${o.started}</code></td><td>${esc(o.lead)}</td><td>${pill(o.risk)}</td><td><button class="btn" onclick="showOp(${i})">Details</button></td></tr>`).join('')}</tbody></table></div>`)+`<div class="title" style="margin-top:20px"><div><span class="eyebrow">LOCAL WORKBOARD</span><h1 style="font-size:22px">Validation task flow</h1></div><button class="btn" onclick="addTask()">+ Add task</button></div><div class="kanban">${['To Do','In Progress','Blocked','Completed'].map(phase=>`<div class="col"><div class="colhead"><span>${phase}</span><b>${tasks.filter(t=>t.phase===phase).length}</b></div>${tasks.filter(t=>t.phase===phase).map((t,i)=>`<button class="task" onclick="cycleTask('${esc(t.id)}')">${esc(t.title)}<small>${esc(t.owner)} · ${esc(t.priority)}</small></button>`).join('')}</div>`).join('')}</div>`,
      'OSINT':()=>title('02','OSINT context queue','Mock aggregate signals for analyst workflow design. External retrieval is intentionally disabled.',`<button class="btn" onclick="exportOsint()">Download JSON</button>`)+`<div class="filters"><input class="search" id="osintSearch" oninput="renderOsint()" placeholder="Search summaries or sources"/><button class="chip active" onclick="setSource('All')">All</button><button class="chip" onclick="setSource('Advisory')">Advisory</button><button class="chip" onclick="setSource('News')">News</button><button class="chip" onclick="setSource('Code Repo')">Code Repo</button><button class="chip" onclick="setSource('Forum')">Forum</button><button class="chip" onclick="setSource('Social')">Social</button></div><div class="osint"><div id="osintTable"></div>${panel(['DISTRIBUTION','Source mix',''],`<div class="donut"></div><div class="key">● Advisory / News<br><span style="color:var(--amber)">●</span> Forums / Social<br><span style="color:#87979e">●</span> Code repositories<br><p style="color:var(--muted);line-height:1.5">Signals are sample context only; they are not threat attribution or evidence of compromise.</p></div>`)}</div>`,
      'APT Profiles':()=>title('03','Threat-actor context profiles','A planning reference for defensive exercises. General behavior context only, not live activity or targeting instructions.')+`<div class="profiles">${[['Midnight Blizzard','APT29 / Cozy Bear','Strategic intelligence','Government & policy','T1566, T1078, T1589','Authority cues; trusted collaboration channels','Patient, staged, evidence-led'],['Lazarus Group','Hidden Cobra','Financial and strategic','Finance & technology','T1195, T1566, T1027','Opportunity framing; role-specific urgency','Adaptive, campaign-oriented'],['Scattered Spider','UNC3944','Access and financial gain','Identity-heavy services','T1078, T1566, T1098','Service-desk pressure; identity trust','Fast-moving, socially adaptive'],['Volt Typhoon','Bronze Silhouette','Strategic positioning','Critical infrastructure','T1070, T1078, T1505','Operational continuity; trusted admin paths','Low-noise, persistent']].map(p=>`<article class="profile"><span class="eyebrow">CONTEXT PROFILE</span><h2>${p[0]}</h2><p>${p[1]}</p><dl><dt>Motivation</dt><dd>${p[2]}</dd><dt>Sector relevance</dt><dd>${p[3]}</dd><dt>ATT&CK context</dt><dd>${p[4]}</dd></dl><div class="mind"><b>THREAT-ACTOR MINDSET</b><br>Triggers: ${p[5]}<br>Tempo: ${p[6]}</div></article>`).join('')}</div>`,
      'Scam Analysis':()=>title('04','Human-risk simulation planning','Modern fraud patterns translated into consent-based tabletop and awareness exercise formats.')+`<div class="scam"><div class="panel"><div class="ph"><div><span class="eyebrow">EMERGING VECTORS</span><h2>Simulation design queue</h2></div></div><div id="vectors"></div></div><div id="plan"></div></div>`,
      'Validation Library':()=>title('05','Validation library','Safe control-validation plans and public advisory references. This workspace does not generate payloads, initiate sessions, or execute commands.')+`<div class="safe-card"><div><span class="eyebrow">SAFE BY DESIGN</span><h2>Evidence-oriented validation, not live exploitation.</h2><p>Use these templates to frame approved control tests, tabletop discussions, and remediation verification without targeting systems or handling credentials.</p><button class="btn primary" onclick="notice('Validation brief','A template with scope, evidence, stop criteria, and remediation fields is ready to draft.')">Create validation brief</button></div><div class="safe-list"><article><b>01 · Identity control review</b><p>Verify alerting and approval evidence using a pre-agreed test record.</p></article><article><b>02 · Web control walkthrough</b><p>Review logs, headers, and remediation owner documentation with the application team.</p></article><article><b>03 · Cloud posture evidence</b><p>Map supplied configuration artifacts to agreed assurance questions.</p></article></div></div><div style="margin-top:17px">${panel(['ADVISORY REFERENCE','Vulnerability review queue',''],`<div style="display:flex;justify-content:space-between;gap:20px;align-items:center;padding:17px"><div><code style="color:var(--cyan)">CVE-2026-EXAMPLE</code><b style="display:block;margin-top:5px">Placeholder advisory record</b><small style="color:var(--muted)">Vendor and product fields are intentionally illustrative.</small></div><a class="btn" href="https://nvd.nist.gov/" target="_blank" rel="noreferrer">NVD reference</a></div>`)}</div>`,
      'Telemetry Lab':()=>title('06','Telemetry lab','A harmless visualization of lab-health records. No external hosts, listener controls, beacon logs, or remote commands are connected.')+`<div class="two">${panel(['LAB HEALTH','Mock observability nodes',pill('Local only')],map())}${panel(['NODE REGISTER','Training environments',''],`<div class="nodes">${[['LAB-A','HTTPS','13:59Z'],['LAB-B','DNS','13:48Z'],['LAB-C','SMB','13:31Z']].map(n=>`<div class="node"><div><b>${n[0]}</b><br><small>${n[1]} · isolated training environment</small></div><small>${n[2]}</small></div>`).join('')}</div>`)}</div><div style="margin-top:17px">${panel(['LAB EVENT VIEWER','Audit-safe event log',''],`<div class="activity"><div class="event"><i class="dot"></i><div><b>LAB-A</b><code>14:03:18Z</code><p>Health check completed · no external call</p></div></div><div class="event"><i class="dot amber"></i><div><b>LAB-B</b><code>13:58:42Z</code><p>Configuration review requested · local mock state</p></div></div></div>`)}</div>`,
      'Team':()=>title('07','Team readiness','Role coverage and workload visibility for the authorized exercise team.')+`<div class="two">${panel(['ROSTER','Assigned operators',''],`<div class="roster">${[['MR','M. Rivera','Team Lead','Northstar coordination'],['AC','A. Chen','Social Engineering','Supplier drill design'],['SP','S. Patel','OSINT Analyst','Signal triage'],['JO','J. Okafor','Reporting','Cedar closeout']].map(p=>`<div class="person"><i class="avatar">${p[0]}</i><div><b>${p[1]}</b><small>${p[2]}</small></div><small>${p[3]}</small></div>`).join('')}</div>`) }${panel(['WORKLOAD','Tasks by member',''],`<div class="activity">${[['M. Rivera',3],['A. Chen',2],['S. Patel',4],['J. Okafor',3]].map(p=>`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${p[0]}</span><b style="color:var(--cyan)">${p[1]}</b></div><div style="height:7px;margin-top:7px;background:#fff2;border-radius:8px"><i style="display:block;width:${p[1]*20}%;height:100%;background:var(--cyan);border-radius:8px"></i></div></div>`).join('')}</div>`)}</div>`,
      'Reporting':()=>title('08','Report assembly','Create a local Markdown working copy from stored operation metadata, with clearly marked evidence placeholders.',`<button class="btn primary" onclick="downloadReport()">Download Markdown</button>`)+`<div class="report"><section class="dossier"><div><span class="eyebrow">LOCAL REPORT BUILDER</span><h2>Turn scope into a readable record.</h2><p>Pre-populate a safe working document from planning metadata. Replace placeholders only with approved, evidence-based findings.</p></div></section><section class="panel form"><label>Operation<select id="reportOp">${operations.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></label><label>Template<textarea># {{operation_name}}\n\n> Authorized-use report generated locally.\n\n## Scope\n{{scope}}\n\n## Findings\n{{findings}}\n\n## Remediation ownership\n{{owners}}</textarea></label><button class="btn" onclick="downloadReport()">Generate local report</button></section></div>`,
      'Settings':()=>title('09','Local settings','Configuration is browser-local. No API key, connection detail, or remote integration is stored or activated by this build.')+`<div class="settings"><section class="panel"><div class="setting"><div><b>Refresh interval</b><p>Refresh visible mock data and UI timestamps.</p></div><select onchange="notice('Refresh interval','Local refresh setting updated.')"><option>5 seconds</option><option>10 seconds</option><option>30 seconds</option></select></div><div class="setting"><div><b>Context sources</b><p>Keep sample context signals visible in the OSINT queue.</p></div><input type="checkbox" checked></div><div class="setting"><div><b>Alert threshold</b><p>Set the local visual threshold for the sample queue.</p></div><input type="number" min="1" value="5"></div><div class="setting"><div><b>Clear all local data</b><p>Return this browser to built-in mock records.</p></div><button class="btn" onclick="clearData()">Reset local</button></div></section><section class="panel code"><span class="eyebrow">CONFIG OBJECT</span><h2>Integration placeholders</h2><pre>const CONFIG = {\n  USE_MOCK_DATA: true,\n  API_ENDPOINTS: {\n    osint: '',\n    advisories: '',\n    telemetry: ''\n  }\n}</pre><p style="color:var(--muted);font-size:11px;line-height:1.5">Live integrations require a reviewed, authenticated backend. This static build deliberately leaves endpoints blank.</p></section></div>`
    };
    let source='All',selectedVector=0;const vectors=[['AI-assisted spear-phishing awareness',82,78,56,'Use an approved fictional persona, fixed training audience, and no credential collection. Measure reporting and escalation only.'],['Deepfake vishing resilience',67,86,72,'Run a disclosed tabletop call-verification drill using internal role-play and written stop criteria.'],['Synthetic identity workflow review',61,73,64,'Validate identity-proofing controls with synthetic records supplied by the business, never real applicants.'],['QR-code handling exercise',74,65,42,'Use harmless training QR codes that route to an internal education page and record aggregate completion only.'],['Dependency-change verification',57,83,68,'Tabletop package-maintenance approval paths; do not publish, alter, or execute code.']];
    function navigate(name){document.getElementById('crumb').textContent=name;document.getElementById('view').innerHTML=views[name]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='OSINT')renderOsint();if(name==='Scam Analysis')renderVectors();}function initNav(){document.getElementById('nav').innerHTML=nav.map((n,i)=>`<button data-view="${n}" onclick="navigate('${n}')"><code>${String(i).padStart(2,'0')}</code><span>${n}</span></button>`).join('')}function showModal(html){document.getElementById('modalContent').innerHTML=`<button class="close" onclick="hideModal()">Close</button>${html}`;document.getElementById('modal').classList.add('show')}function hideModal(){document.getElementById('modal').classList.remove('show')}function notice(h,p){showModal(`<span class="eyebrow">LOCAL WORKSPACE</span><h2>${esc(h)}</h2><p>${esc(p)}</p>`)}function showOp(i){const o=operations[i];showModal(`<span class="eyebrow">OPERATION DOSSIER · ${o.id}</span><h2>${esc(o.name)}</h2><p><b>Scope</b><br>${esc(o.scope)}</p><p><b>Objective</b><br>${esc(o.objective)}</p><p><b>Rules of engagement</b><br>${esc(o.roe)}</p>`)}function addOperation(){const n=prompt('Operation name');if(!n)return;operations.unshift({id:'OP-24-'+String(20+operations.length).padStart(3,'0'),name:n,sector:'General',phase:'Recon',status:'Planning',started:new Date().toISOString().slice(0,10),lead:'Unassigned',risk:'Low',scope:'Local planning record. Add the written authorization reference before activation.',objective:'Document a safe, consent-based validation objective.',roe:'No execution, no credential collection, no external targeting, and explicit stop criteria.'});save();navigate('Operations');notice('Operation saved','A local planning record was added; no external action was taken.')}function addTask(){const t=prompt('Scoped task title');if(!t)return;tasks.push({id:'TK-'+String(tasks.length+1).padStart(2,'0'),title:t,phase:'To Do',owner:'Unassigned',priority:'Moderate'});save();navigate('Operations')}function cycleTask(id){const steps=['To Do','In Progress','Blocked','Completed'];const t=tasks.find(x=>x.id===id);t.phase=steps[(steps.indexOf(t.phase)+1)%steps.length];save();navigate('Operations')}function setSource(s){source=s;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.textContent===s));renderOsint()}function renderOsint(){const q=(document.getElementById('osintSearch')?.value||'').toLowerCase();const rows=osint.filter(x=>(source==='All'||x[1]===source)&&(x[1]+' '+x[4]).toLowerCase().includes(q));document.getElementById('osintTable').innerHTML=panel(['MOCK CONTEXT FEED','Analyst signal queue',''],`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Source</th><th>Summary</th><th>Signal</th><th>Relevance</th></tr></thead><tbody>${rows.map(x=>`<tr><td><code>${x[0]}</code></td><td style="color:var(--cyan)">${x[1]}</td><td>${x[4]}</td><td>${pill(x[2])}</td><td><span class="score"><i style="--w:${x[3]}%"></i>${x[3]}</span></td></tr>`).join('')}</tbody></table></div>`)}function exportOsint(){const blob=new Blob([JSON.stringify(osint,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='signal-archive-osint.json';a.click();URL.revokeObjectURL(a.href);notice('Export prepared','The mock OSINT queue downloaded as JSON.')}function renderVectors(){document.getElementById('vectors').innerHTML=vectors.map((v,i)=>`<button class="vector ${i===selectedVector?'active':''}" onclick="selectedVector=${i};renderVectors()"><b>${v[0]}</b><small>Likelihood ${v[1]} · Impact ${v[2]} · Complexity ${v[3]}</small></button>`).join('');const v=vectors[selectedVector];document.getElementById('plan').innerHTML=panel(['SELECTED VECTOR',v[0],pill('Safe simulation')],`<div class="plan"><svg class="radar" viewBox="0 0 300 230"><g transform="translate(150 115)" fill="none" stroke="#ffffff33"><polygon points="0,-85 81,-26 50,69 -50,69 -81,-26"/><polygon points="0,-52 49,-16 30,41 -30,41 -49,-16"/><line x1="0" y1="0" x2="0" y2="-90"/><line x1="0" y1="0" x2="85" y2="-28"/><line x1="0" y1="0" x2="52" y2="72"/><line x1="0" y1="0" x2="-52" y2="72"/><line x1="0" y1="0" x2="-85" y2="-28"/><polygon points="0,${-v[2]} ${v[1]},${-v[3]/2} ${v[3]/1.6},${v[2]/1.4} ${-v[1]/1.5},${v[3]/1.2} ${-v[3]},${-v[2]/3}" fill="#8dd5f733" stroke="#8dd5f7" stroke-width="2"/></g></svg><span class="eyebrow">RECOMMENDED EXERCISE</span><p>${v[4]}</p><button class="btn primary" onclick="notice('Simulation plan generated','A safe, consent-led outline was prepared locally with stop criteria and reporting objectives.')">Generate simulation plan</button></div>`)}function downloadReport(){const o=operations.find(x=>x.id===document.getElementById('reportOp')?.value)||operations[0],text=`# ${o.name}\n\n> Authorized-use report generated locally.\n\n## Scope\n${o.scope}\n\n## Objective\n${o.objective}\n\n## Rules of Engagement\n${o.roe}\n\n## Findings placeholder\nAdd approved, evidence-based findings here.\n`;const blob=new Blob([text],{type:'text/markdown'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.id.toLowerCase()+'-report.md';a.click();URL.revokeObjectURL(a.href);notice('Report downloaded','The local Markdown report contains planning data and placeholders only.')}function clearData(){localStorage.removeItem('sa_ops');localStorage.removeItem('sa_tasks');operations=baseOps;tasks=[];navigate('Settings');notice('Local data reset','The dashboard returned to its built-in mock records.')}function tick(){document.getElementById('clock').textContent='UTC '+new Date().toISOString().slice(11,19)}let idle;function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>notice('Session expired','Your local workspace timed out after 15 minutes of inactivity. No remote session or external integration was active.'),CONFIG.SESSION_TIMEOUT_MS)}['mousemove','keydown','touchstart','click'].forEach(e=>addEventListener(e,resetIdle));initNav();navigate('Overview');tick();setInterval(tick,1000);resetIdle();
  </script>
</body>
